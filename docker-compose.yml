version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: scheduling_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: scheduling_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Evolution API (WhatsApp)
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: scheduling_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Configurações básicas da API
      - PORT=8080
      - DATABASE_ENABLED=false
      - AUTHENTICATION_API_KEY=myevolutionapikey123
    depends_on:
      - postgres

volumes:
  postgres_data:
